name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - build/01-foundation-database
      - build/04a-commerce-integrations

jobs:
  build-test:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: Preseed Supabase PostgREST image
        run: |
          docker pull ghcr.io/supabase/postgrest:v14.13
          docker tag ghcr.io/supabase/postgrest:v14.13 public.ecr.aws/supabase/postgrest:v14.13

      - name: Start local Supabase
        run: npx --yes supabase@2.107.0 start -x studio,imgproxy,storage-api,vector,edge-runtime,logflare,supavisor

      - name: Export local Supabase credentials
        run: |
          eval "$(npx --yes supabase@2.107.0 status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Apply and validate Supabase migrations
        run: |
          npx --yes supabase@2.107.0 db reset --local
          npx --yes supabase@2.107.0 db lint --local

      - name: RLS integration tests
        run: npm run test:rls

      - name: Playwright smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@2.107.0 stop
