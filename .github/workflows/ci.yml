name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - build/01-foundation-database

jobs:
  build-test:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: Start local Supabase
        run: npx supabase@2.107.0 start

      - name: Apply and validate Supabase migrations
        run: |
          npx supabase@2.107.0 db reset --local
          npx supabase@2.107.0 db lint --local

      - name: RLS integration tests
        run: npm run test:rls

      - name: Playwright smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Stop local Supabase
        if: always()
        run: npx supabase@2.107.0 stop
